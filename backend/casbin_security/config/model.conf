# Модель разграничения прав OMSA Ledger (ТЗ, раздел 10).
#
# Субъект запроса — роль или ключ права сотрудника:
#   authenticated — любой вошедший пользователь, в том числе уволенный (только просмотр);
#   active        — работающий сотрудник (наследует authenticated);
#   grpAdd, grpEdit, grpDel, menuRefs, menuSettings, jrnDel, usrEdit — права из поля TUsers.rules.
# Ограничения jrnOwnOnly и jrnStatusOnly зависят от конкретной записи журнала
# и проверяются в app/services/access.py.

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && r.obj == p.obj && r.act == p.act
