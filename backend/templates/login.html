<!DOCTYPE html>
<html lang="ru">
<head>
{% include "_head.html" %}
<title>Вход</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css', v=asset_version) }}">
</head>
<body>

<div style="min-height:100vh;width:100%;position:relative;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;overflow:hidden;padding:16px;">
  <img src="{{ url_for('static', filename='images/login_bg.jpg', v=asset_version) }}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;">
  <div style="position: absolute; inset: 0; z-index: 1; background: rgba(252,252,252,0.75); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); border: 1px solid rgba(240,240,240,0.8); box-shadow: 0px 1px 40px 10px rgba(0,0,0,0.08); left: -4px; top: -6px"></div>

  <form id="lgForm" novalidate data-redirect="{{ url_for('web_pages.journal') }}" data-notifications="on"
        style="position: relative; z-index: 2; width: 100%; max-width: 420px; padding: clamp(28px, 6vw, 40px) clamp(22px, 6vw, 36px) 20px; display: flex; flex-direction: column; gap: 16px; background: rgba(252,252,252,0.08); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(240,240,240,0.3); border-radius: 20px; box-shadow: 0 4px 30px rgba(0,0,0,0.03); box-sizing: border-box;">

    <div style="display:flex;flex-direction:column;gap:6px;text-align:center;margin-bottom:4px;">
      <h1 style="margin: 0; font-family: -apple-system, sans-serif; font-size: 25px; font-weight: 500; line-height: 28px; letter-spacing: -0.5px; color: #0a0a0a">Вход</h1>
      <p style="margin:0;font-family:-apple-system,sans-serif;font-size:13px;font-weight:400;line-height:21.125px;letter-spacing:normal;color:#7d8187;">Войдите в свой аккаунт</p>
    </div>

    <div style="display:flex;flex-direction:column;gap:6px;">
      <label for="lg-login" style="font-family:-apple-system,sans-serif;font-size:14px;font-weight:500;line-height:20px;letter-spacing:normal;color:#0a0a0a;">Логин</label>
      <input id="lg-login" name="login" type="text" autocomplete="username" placeholder="Введите логин" maxlength="100" style="height: 48px; width: 100%; padding: 0 12px; font-size: max(16px, 1em); border-radius: 16px; border: 1px solid #d5d9e2; background: #ffffff; font-family: -apple-system, sans-serif; font-weight: 300; line-height: 24px; letter-spacing: normal; color: #0a0a0a; outline: none; box-sizing: border-box">
    </div>

    <div style="display:flex;flex-direction:column;gap:6px;">
      <label for="lg-pass" style="font-family:-apple-system,sans-serif;font-size:14px;font-weight:500;line-height:20px;letter-spacing:normal;color:#0a0a0a;">Пароль</label>
      <div style="position:relative;display:flex;align-items:center;">
        <input id="lg-pass" name="password" type="password" autocomplete="current-password" placeholder="Введите пароль" maxlength="256" style="width: 100%; height: 48px; padding: 0 44px 0 12px; font-size: max(16px, 1em); border-radius: 16px; border: 1px solid #d5d9e2; background: #ffffff; font-family: -apple-system, sans-serif; font-weight: 300; line-height: 24px; letter-spacing: normal; color: #0a0a0a; outline: none; box-sizing: border-box">
        <button type="button" id="lgEye" aria-label="Показать пароль" style="position:absolute;right:4px;width:36px;height:36px;border:none;background:transparent;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:#6e6e73;"></button>
      </div>
    </div>

    <div style="min-height:16px;">
      <p id="lgError" role="alert" style="margin:0;text-align:center;font-size:12px;font-weight:400;line-height:16px;letter-spacing:-0.12px;color:#ff3b30;"></p>
    </div>

    <button type="submit" id="lgSubmit" style="height: 42px; width: 107px; align-self: center; margin-top: 8px; border: none; border-radius: 99px; background: #0a0a0a; color: #ffffff; font-family: -apple-system, sans-serif; font-size: 14px; font-weight: 500; letter-spacing: normal; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">Войти</button>

  </form>
</div>

<script src="{{ url_for('static', filename='js/login.js', v=asset_version) }}"></script>
</body>
</html>
