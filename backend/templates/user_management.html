<!DOCTYPE html>
<html lang="ru">
<head>
{% include "_head.html" %}
<title>Управление пользователями</title>
<script src="{{ url_for('static', filename='js/loading_screen.js', v=asset_version) }}"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/user_management.css', v=asset_version) }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/loading_screen.css', v=asset_version) }}">
</head>

<body>
<!-- ============================================================
     РАЗМЕТКА
     ============================================================ -->
{% include "_loading_screen.html" %}
<div class="page">
  <div class="page-bg"></div>
  <div class="page-veil"></div>

  <header class="um-head">
    <div class="um-head__left">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#050505" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>
      <span class="um-head__title">Управление пользователями</span>
    </div>
    <button class="um-icon um-logout" type="button" data-click="onLogout" title="Выход из системы">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </header>

  <main class="um-main">
    <!-- левая колонка: поиск, кнопки, группы -->
    <div class="um-col">

      <div class="um-col" style="gap:10px;">
        <div class="search">
          <span class="search__icon">
            <svg width="17" height="17" viewBox="0 0 17 17" fill="none"><path d="M0 6.62402C0 5.71094 0.171549 4.85596 0.514648 4.05908C0.857747 3.25667 1.33366 2.55111 1.94238 1.94238C2.55111 1.33366 3.25391 0.857747 4.05078 0.514648C4.85319 0.171549 5.71094 0 6.62402 0C7.53711 0 8.39209 0.171549 9.18896 0.514648C9.99137 0.857747 10.6969 1.33366 11.3057 1.94238C11.9144 2.55111 12.3903 3.25667 12.7334 4.05908C13.0765 4.85596 13.248 5.71094 13.248 6.62402C13.248 7.38216 13.1263 8.10156 12.8828 8.78223C12.6449 9.46289 12.3128 10.0799 11.8867 10.6333L15.9458 14.7173C16.0343 14.8058 16.1007 14.9082 16.145 15.0244C16.1948 15.1406 16.2197 15.2651 16.2197 15.3979C16.2197 15.5806 16.1782 15.7466 16.0952 15.896C16.0177 16.0454 15.9071 16.1616 15.7632 16.2446C15.6193 16.3332 15.4533 16.3774 15.2651 16.3774C15.1323 16.3774 15.005 16.3525 14.8833 16.3027C14.7671 16.2585 14.6592 16.1893 14.5596 16.0952L10.4756 12.0029C9.93327 12.3903 9.33561 12.6947 8.68262 12.916C8.02962 13.1374 7.34342 13.248 6.62402 13.248C5.71094 13.248 4.85319 13.0765 4.05078 12.7334C3.25391 12.3903 2.55111 11.9144 1.94238 11.3057C1.33366 10.6969 0.857747 9.99414 0.514648 9.19727C0.171549 8.39486 0 7.53711 0 6.62402ZM1.41943 6.62402C1.41943 7.34342 1.55225 8.01855 1.81787 8.64941C2.08903 9.27474 2.46257 9.82536 2.93848 10.3013C3.41992 10.7772 3.97331 11.1507 4.59863 11.4219C5.22949 11.693 5.90462 11.8286 6.62402 11.8286C7.34342 11.8286 8.01579 11.693 8.64111 11.4219C9.27197 11.1507 9.82536 10.7772 10.3013 10.3013C10.7772 9.82536 11.1507 9.27474 11.4219 8.64941C11.693 8.01855 11.8286 7.34342 11.8286 6.62402C11.8286 5.90462 11.693 5.23226 11.4219 4.60693C11.1507 3.97607 10.7772 3.42269 10.3013 2.94678C9.82536 2.46533 9.27197 2.0918 8.64111 1.82617C8.01579 1.55501 7.34342 1.41943 6.62402 1.41943C5.90462 1.41943 5.22949 1.55501 4.59863 1.82617C3.97331 2.0918 3.41992 2.46533 2.93848 2.94678C2.46257 3.42269 2.08903 3.97607 1.81787 4.60693C1.55225 5.23226 1.41943 5.90462 1.41943 6.62402Z" fill="#999999"/></svg>
          </span>
          <input id="search" class="search__input" type="text" data-input="onSearchChange" placeholder="Поиск по ФИО или логину">
          <button id="searchClear" class="search__clear" type="button" data-click="onClearSearch" title="Очистить">
            <svg width="17" height="17" viewBox="0 0 17 17" fill="none"><path d="M8.4668 16.9336C7.29915 16.9336 6.20345 16.7122 5.17969 16.2695C4.15592 15.8324 3.25667 15.2264 2.48193 14.4517C1.70719 13.6714 1.09847 12.7721 0.655762 11.7539C0.218587 10.7301 0 9.63444 0 8.4668C0 7.29915 0.218587 6.20345 0.655762 5.17969C1.09847 4.15592 1.70719 3.25667 2.48193 2.48193C3.25667 1.70719 4.15592 1.10124 5.17969 0.664062C6.20345 0.221354 7.29915 0 8.4668 0C9.63444 0 10.7301 0.221354 11.7539 0.664062C12.7777 1.10124 13.6769 1.70719 14.4517 2.48193C15.2264 3.25667 15.8324 4.15592 16.2695 5.17969C16.7122 6.20345 16.9336 7.29915 16.9336 8.4668C16.9336 9.63444 16.7122 10.7301 16.2695 11.7539C15.8324 12.7721 15.2264 13.6714 14.4517 14.4517C13.6769 15.2264 12.7777 15.8324 11.7539 16.2695C10.7301 16.7122 9.63444 16.9336 8.4668 16.9336ZM5.67773 11.9531C5.87695 11.9531 6.04574 11.8867 6.18408 11.7539L8.4751 9.44629L10.7744 11.7539C10.9017 11.8867 11.0649 11.9531 11.2642 11.9531C11.4578 11.9531 11.6211 11.8867 11.7539 11.7539C11.8867 11.6156 11.9531 11.4523 11.9531 11.2642C11.9531 11.0594 11.8867 10.8962 11.7539 10.7744L9.44629 8.4751L11.7622 6.16748C11.895 6.02913 11.9614 5.86589 11.9614 5.67773C11.9614 5.48958 11.895 5.3291 11.7622 5.19629C11.6294 5.06348 11.4689 4.99707 11.2808 4.99707C11.0981 4.99707 10.9404 5.06348 10.8076 5.19629L8.4751 7.51221L6.15918 5.20459C6.02083 5.07731 5.86035 5.01367 5.67773 5.01367C5.48958 5.01367 5.3291 5.08008 5.19629 5.21289C5.06348 5.34017 4.99707 5.50065 4.99707 5.69434C4.99707 5.87695 5.06348 6.03743 5.19629 6.17578L7.50391 8.4751L5.19629 10.7827C5.06348 10.9155 4.99707 11.076 4.99707 11.2642C4.99707 11.4523 5.06348 11.6156 5.19629 11.7539C5.3291 11.8867 5.48958 11.9531 5.67773 11.9531Z" fill="#999999"/></svg>
          </button>
        </div>

        <div class="um-toolbar">
          <button class="btn btn--group" type="button" data-click="onAddGroup" title="Добавить группу">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>Группа</span>
          </button>

          <button class="btn" type="button" data-click="onAddUser" title="Добавить сотрудника">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><line x1="12" y1="7.5" x2="12" y2="16.5"/><line x1="7.5" y1="12" x2="16.5" y2="12"/></svg>
            <span>Сотрудник</span>
          </button>

          <button id="btnDelete" class="btn btn--del" type="button" data-click="onDelete" title="Удалить сотрудника">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
            <span>Удалить</span>
          </button>

          <button id="btnArchive" class="btn btn--archive" type="button" data-click="onToggleArchive">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="5" rx="1.5"/><path d="M4 9v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9"/><line x1="10" y1="13.5" x2="14" y2="13.5"/></svg>
            <span>Архив</span>
          </button>

          <button class="btn btn--save" type="button" data-click="onSave" title="Сохранить">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            <span>Сохранить</span>
          </button>
        </div>
      </div>

      <div id="groups" class="groups"></div>
    </div>

    <!-- правая колонка: права -->
    <aside id="rights" class="um-rights"></aside>
  </main>

  <div id="toast" class="toast"></div>
</div>

<!-- ============================================================
     СКРИПТЫ
     ============================================================ -->
<script src="{{ url_for('static', filename='js/omsa_core.js', v=asset_version) }}"></script>
<script src="{{ url_for('static', filename='js/user_management.js', v=asset_version) }}"></script>
</body>
</html>
