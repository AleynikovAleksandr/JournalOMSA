# Переменные окружения production, которых нет в backend/app/schemas/settings.py:
# параметры Nginx и Gunicorn. Все настройки приложения — в secret.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: omsa-ledger-config
data:
  # ---- Nginx (nginx/nginx.conf.template) ----
  HTTPS_HOST: "85.95.150.8"
  # Nginx geo entries: сети, которым разрешено управление пользователями (порт 5620)
  ADMIN_ALLOWED_CIDRS: |-
    0.0.0.0/0 1;
    ::/0 1;

  # ---- Gunicorn (backend/gunicorn/gunicorn.conf.py) ----
  WEB_CONCURRENCY: "3"
  # CIDR сети подов кластера: X-Forwarded-For принимается только от Nginx
  FORWARDED_ALLOW_IPS: 10.244.0.0/16
  GUNICORN_LOG_LEVEL: info
