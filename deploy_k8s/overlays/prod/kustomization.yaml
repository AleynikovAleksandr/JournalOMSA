# Production: наследует base и добавляет настройки окружения.
#   scripts/deploy_k8s.sh prod
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: omsa-ledger

resources:
  - ../../base
  - configmap.yaml
  - secret.yaml

patches:
  - path: patches/replicas.yaml
  - path: patches/resources.yaml
  - path: patches/image-tag.yaml
  - path: patches/affinity.yaml
