# Настройки приложения для production — все параметры backend/app/schemas/settings.py.
# Файл в репозиторий не добавляется (.gitignore). Рекомендуется заменить на
# SealedSecret или ExternalSecret.
#
# В ConfigMap (configmap.yaml) остаются только параметры Nginx и Gunicorn,
# которых нет в схеме настроек.
apiVersion: v1
kind: Secret
metadata:
  name: omsa-ledger-secrets
type: Opaque
stringData:
  # ---- Приложение ----
  APP_ENV: "production"
  # совпадает с тегом образа (patches/image-tag.yaml)
  APP_VERSION: "1.0.0"
  LOG_LEVEL: "INFO"
  # пусто — журнал приложения только в stderr
  APP_LOG_DIR: ""
  # единый часовой пояс времени задач журнала (одинаково для всех пользователей)
  APP_TIMEZONE: "Asia/Vladivostok"

  # ---- Ключи: SECRET_KEY — сессии Flask и CSRF, JWT_SECRET — подпись JWT ----
  SECRET_KEY: "Gop4fQHk9aXSIXICoG0GH0N4Ip6oM6iFZzWEPaAlkVH1XEHXlzkjbRXTCD8TPpON"
  JWT_SECRET: "A8og8ddHQRlEcMF_BXaNA5hGqSD8u0BEKpLnLgW8f5vdoRN5Cq351TEOp4z6e-vT"
  JWT_ALGORITHM: "HS256"
  # срок JWT (ТЗ, 4.1)
  ACCESS_TOKEN_TTL_MINUTES: "15"
  REFRESH_TOKEN_TTL_DAYS: "14"

  # ---- Хеширование паролей Argon2id ----
  ARGON2_TIME_COST: "3"
  ARGON2_MEMORY_KIB: "65536"
  ARGON2_PARALLELISM: "4"

  # ---- PostgreSQL (порт Service 5490) ----
  # пусто — строка подключения собирается из POSTGRES_*
  DATABASE_URL: ""
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5490"
  # используется и контейнером PostgreSQL
  POSTGRES_USER: "omsa"
  # используется и контейнером PostgreSQL
  POSTGRES_DB: "omsa_ledger"
  # контейнер PostgreSQL получает этот же пароль файлом /run/secrets/postgres_password
  POSTGRES_PASSWORD: "Xt,ehfirf2026"
  # 4 пода × 3 воркера × (3 + 2) = 60 соединений (документ «Gunicorn», 7)
  DB_POOL_SIZE: "3"
  DB_MAX_OVERFLOW: "2"
  DB_POOL_RECYCLE: "1800"

  # ---- Redis (порт Service 6399), пользователь omsa_app из deploy_k8s/base/redis/users.acl ----
  # пусто — строка подключения собирается из REDIS_*
  REDIS_URL: ""
  REDIS_HOST: "redis"
  REDIS_PORT: "6399"
  REDIS_USERNAME: "omsa_app"
  # в users.acl записан его SHA-256
  REDIS_PASSWORD: "Xt,ehfirf2026"
  REDIS_DB: "0"
  CELERY_BROKER_DB: "1"

  # ---- Вход в систему (ТЗ, раздел 3) ----
  LOGIN_MAX_ATTEMPTS: "5"
  LOGIN_LOCK_MINUTES: "15"
  LOGIN_IP_MAX_ATTEMPTS: "50"
  LOGIN_IP_WINDOW_MINUTES: "15"

  # ---- Адреса страниц и cookie (документ «Страницы Flask и порты») ----
  WEB_ORIGINS: "https://85.95.150.8,https://85.95.150.8:449,https://85.95.150.8:5600"
  ADMIN_ORIGINS: "https://85.95.150.8:5620"
  ADMIN_PUBLIC_URL: "https://85.95.150.8:5620/users"
  COOKIE_SECURE: "true"
  REQUIRE_SECURE_WEBSOCKET: "true"
  CSRF_ENABLED: "true"

  # ---- Уведомления (ТЗ, раздел 2): события 2 и 3 отключаются здесь, а не пользователем ----
  NOTIFY_REMIND_24H_ENABLED: "true"
  NOTIFY_REMIND_24H_MINUTES: "1440"
  NOTIFY_REMIND_1H_ENABLED: "true"
  NOTIFY_REMIND_1H_MINUTES: "60"
  NOTIFY_OVERDUE_INTERVAL_MINUTES: "60"
  TASKS_UPCOMING_DAYS: "7"

  WEB_PUSH_PRIVATE_KEY: "hKkFKrj7cWFYIeTRk7-E7H7wf6wgylY9Bk1NY9ztJQw"
  WEB_PUSH_PUBLIC_KEY: "BJStyJyM6eS0Eb9NiTpCdyVi91CvkBF96wj34NS2_j24_bJ4us-aiKOsoNAm133riQajuDzqPAkZcvkq0mPICjo"
  WEB_PUSH_SUBJECT: "https://85.95.150.8"
  # ---- Блокировка карточки записи и WebSocket ----
  EDIT_LOCK_TTL_SECONDS: "300"
  WS_AUTH_TIMEOUT_SECONDS: "5"

  # ---- Первичный администратор (создаётся при первом развёртывании) ----
  ADMIN_LOGIN: "admin"
  ADMIN_PASSWORD: "2729960"
