# Тег образов приложения: номер выпуска или хеш коммита.
# Образы backend, worker и Nginx должны быть заранее загружены в containerd на узле Kubernetes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  template:
    spec:
      initContainers:
        - name: certificate-bootstrap
          image: omsa-ledger-nginx:1.28.0
          imagePullPolicy: Never
      containers:
        - name: nginx
          image: omsa-ledger-nginx:1.28.0
          imagePullPolicy: Never
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  template:
    spec:
      initContainers:
        - name: initial-data
          image: omsa-ledger-backend:1.0.0
          imagePullPolicy: Never
      containers:
        - name: web
          image: omsa-ledger-backend:1.0.0
          imagePullPolicy: Never
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
spec:
  template:
    spec:
      containers:
        - name: admin
          image: omsa-ledger-backend:1.0.0
          imagePullPolicy: Never
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  template:
    spec:
      containers:
        - name: worker
          image: omsa-ledger-worker:1.0.0
          imagePullPolicy: Never
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beat
spec:
  template:
    spec:
      containers:
        - name: beat
          image: omsa-ledger-worker:1.0.0
          imagePullPolicy: Never
