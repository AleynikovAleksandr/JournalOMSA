# К Redis подключаются только поды приложения и Celery (метка tier: backend)
# через Service redis (порт 6399); снаружи кластера Redis недоступен
# (документ «Redis в OMSA Ledger»: только внутренняя сеть, без публикации наружу).
# NetworkPolicy проверяет порт пода (6379), а не порт Service (6399).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-access
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: backend
      ports:
        - port: 6379
