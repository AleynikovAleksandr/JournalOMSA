# Общие манифесты OMSA Ledger (одинаковые для всех окружений).
#
# Сборка выполняется с параметром --load-restrictor LoadRestrictionsNone:
# ConfigMap подключают файлы backend/database/schema.sql и nginx/nginx.conf.template
# из общего каталога проекта (см. scripts/deploy_k8s.sh).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: omsa-ledger

labels:
  - pairs:
      app.kubernetes.io/part-of: omsa-ledger
    includeSelectors: false
    includeTemplates: true

resources:
  - namespace.yaml
  - storage.yaml
  - postgres
  - redis
  - app
  - worker
  - beat
  - nginx
  - tls/letsencrypt.yaml
