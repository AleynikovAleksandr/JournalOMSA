# PostgreSQL 18 (документ «Образы Docker», 3.1).
# Пароль передаётся файлом секрета (POSTGRES_PASSWORD_FILE): kubectl describe pod его не показывает.
# Том подключается к /var/lib/postgresql, PGDATA не задаётся (pg_upgrade --link при смене версии).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18.6
          imagePullPolicy: Always
          args:
            - -c
            - max_connections=100
            - -c
            - password_encryption=scram-sha-256
            - -c
            - shared_buffers=1GB
            - -c
            - effective_cache_size=3GB
            - -c
            - work_mem=32MB
            - -c
            - maintenance_work_mem=256MB
            - -c
            - min_wal_size=1GB
            - -c
            - max_wal_size=4GB
            - -c
            - checkpoint_completion_target=0.9
            - -c
            - wal_buffers=16MB
            - -c
            - synchronous_commit=on
            - -c
            - max_worker_processes=4
            - -c
            - max_parallel_workers=4
            - -c
            - max_parallel_workers_per_gather=2
            - -c
            - random_page_cost=1.1
            - -c
            - io_method=worker
            - -c
            - io_workers=3
            - -c
            - io_max_combine_limit=1MB
            - -c
            - io_combine_limit=1MB
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: omsa-ledger-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: omsa-ledger-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/postgres_password
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            failureThreshold: 18
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d/schema.sql
              subPath: schema.sql
              readOnly: true
            - name: postgres-password
              mountPath: /run/secrets
              readOnly: true
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: initdb
          configMap:
            name: postgres-initdb
        # Пароль — ключ POSTGRES_PASSWORD Secret omsa-ledger-secrets, подключённый файлом
        - name: postgres-password
          secret:
            secretName: omsa-ledger-secrets
            defaultMode: 0440
            items:
              - key: POSTGRES_PASSWORD
                path: postgres_password
        # Разделяемая память PostgreSQL (shm_size: 1gb из документа «Образы Docker»)
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
