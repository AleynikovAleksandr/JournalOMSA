apiVersion: v1
kind: Namespace
metadata:
  name: omsa-ledger
  labels:
    # Persistent data and application state must use the node's service_data
    # directories via hostPath. Pod Security baseline rejects hostPath volumes,
    # so enforcement is set to privileged for this namespace. Keep restricted
    # warnings enabled to surface other hardening opportunities.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
