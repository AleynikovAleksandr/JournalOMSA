# Static, single-node volumes map PVCs to the persistent service_data directories.
# Pod Security evaluates the PVC references in Pods; the host paths stay on this PV.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: omsa-postgres-data
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /home/alex_a/JournalOMSA/service_data/postgres
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [debian]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: service-data-postgres
spec:
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  storageClassName: ""
  volumeName: omsa-postgres-data
  resources:
    requests:
      storage: 20Gi
---
