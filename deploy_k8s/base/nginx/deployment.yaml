# Nginx reverse proxy; TLS certificate is issued and renewed by cert-manager.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      shareProcessNamespace: true
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: registry.example.local/omsa-ledger/nginx:1.28.0
          imagePullPolicy: Always
          env:
            - name: HTTPS_HOST
              valueFrom:
                configMapKeyRef:
                  name: omsa-ledger-config
                  key: HTTPS_HOST
            - name: ADMIN_ALLOWED_CIDRS
              valueFrom:
                configMapKeyRef:
                  name: omsa-ledger-config
                  key: ADMIN_ALLOWED_CIDRS
            - name: NGINX_ENVSUBST_FILTER
              value: "^(HTTPS_HOST|ADMIN_ALLOWED_CIDRS)$"
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
            - name: web
              containerPort: 5600
            - name: admin
              containerPort: 5620
          readinessProbe:
            tcpSocket:
              port: web
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: nginx.conf.template
              readOnly: true
            - name: certificates
              mountPath: /etc/nginx/certs
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: nginx-run
              mountPath: /var/run
        - name: tls-reloader
          image: registry.example.local/omsa-ledger/nginx:1.28.0
          imagePullPolicy: Always
          command: ["/bin/sh", "-ec"]
          args:
            - |
              fingerprint() { sha256sum /etc/nginx/certs/fullchain.pem /etc/nginx/certs/privkey.pem | sha256sum; }
              previous="$(fingerprint)"
              while sleep 15; do
                current="$(fingerprint)"
                if [ "$current" != "$previous" ]; then
                  nginx -t && nginx -s reload
                  previous="$current"
                fi
              done
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: certificates
              mountPath: /etc/nginx/certs
              readOnly: true
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: certificates
          secret:
            secretName: omsa-nginx-tls
            defaultMode: 0440
            items:
              - key: tls.crt
                path: fullchain.pem
              - key: tls.key
                path: privkey.pem
        - name: nginx-conf
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: nginx-config
            defaultMode: 0444
            items:
              - key: nginx.conf.template
                path: nginx.conf.template
