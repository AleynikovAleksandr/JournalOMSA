# Nginx has no hostPort; forward public TCP 443 to the HTTPS NodePort for TLS-ALPN.
apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: nginx
  ports:
    - name: http
      port: 91
      targetPort: http
    - name: https
      port: 443
      targetPort: https
      nodePort: 31005
    - name: https-alt
      port: 449
      targetPort: https
    - name: web
      port: 5600
      targetPort: web
    - name: admin
      port: 5620
      targetPort: admin
