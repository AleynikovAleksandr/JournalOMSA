# Public app ports are 91, 443, 449, 5600 and 5620. Nginx binds host TCP 443 for TLS-ALPN.
apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: nginx
  ports:
    - name: http
      port: 91
      targetPort: http
    - name: https
      port: 443
      targetPort: https
    - name: https-alt
      port: 449
      targetPort: https
    - name: web
      port: 5600
      targetPort: web
    - name: admin
      port: 5620
      targetPort: admin
