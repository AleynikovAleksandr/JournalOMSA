# При обслуживании узлов хотя бы один под каждого сервиса остаётся в работе
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: web
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: admin
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: admin
