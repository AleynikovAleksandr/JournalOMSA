[project]
name = "omsa-ledger"
version = "1.0.0"
description = "OMSA Ledger — журнал проверок аттестуемых лиц"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Веб: Flask (страницы, формы) + FastAPI (REST/JSON-API) в одном ASGI-приложении
    "flask==3.1.3",
    "flask-sqlalchemy==3.1.1",
    "flask-wtf==1.3.0",
    "wtforms==3.2.2",
    "fastapi==0.143.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "a2wsgi==1.10.10",
    # Сервер
    "gunicorn==26.2.0",
    "uvicorn[standard]==0.54.0",
    "uvicorn-worker==0.4.0",
    # Данные
    "sqlalchemy==2.1.4",
    "psycopg[binary]==3.3.6",
    "redis==8.1.0",
    "celery==5.6.3",
    "packaging==26.3",
    "pywebpush==2.5.0",
    # Безопасность
    "argon2-cffi==25.1.0",
    "pyjwt==2.15.1",
    "casbin==1.43.0",
    "email-validator==2.3.0",
    "tzdata==2026.5",
]

[tool.omsa]
# Каталоги с пакетами приложения: backend/ (app, core, database, casbin_security) и корень (worker)
python-paths = ["backend", "."]
